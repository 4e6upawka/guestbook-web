
name: GuestBook CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: Check project files
        run: |
          pwd
          ls -la
          find . -name "*.csproj"
          
      - name: Restore
        run: dotnet restore GuestBook_Azurite_Complete/GuestBook.Web.csproj

      - name: Build
        run: dotnet build GuestBook_Azurite_Complete/GuestBook.Web.csproj --configuration Release
